<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch API Demo</title>
</head>
<body>
    <h2>Exploring the Fetch API</h2>
    
    <!-- Task 1 & 2: GET Request Button -->
    <button id="loadData">Load Post Data (GET)</button>
    
    <!-- Task 3: POST Request Button -->
    <button id="createPost">Create New Post (POST)</button>
    
    <div id="output" style="margin-top: 20px; border: 1px solid #ccc; padding: 10px;"></div>

    <script>
        const output = document.getElementById("output");

        // Task 2: GET Request Implementation
        document.getElementById("loadData").addEventListener("click", function() {
            output.innerHTML = "<em>Fetching post data...</em>";

            fetch("https://jsonplaceholder.typicode.com/posts/1")
                .then(response => {
                    if (!response.ok) {
                        throw new Error(HTTP error! Status: ${response.status});
                    }
                    return response.json();
                })
                .then(data => {
                    output.innerHTML = `
                        <strong>Post Title:</strong> ${data.title}<br><br>
                        <strong>Content:</strong> ${data.body}
                    `;
                })
                .catch(error => {
                    output.innerHTML = <span style="color:red;">Error: ${error.message}</span>;
                });
        });

        // Task 3: POST Request Implementation
        document.getElementById("createPost").addEventListener("click", function() {
            output.innerHTML = "<em>Sending POST request...</em>";

            fetch("https://jsonplaceholder.typicode.com/posts", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    title: "My New Post",
                    body: "Learning Fetch API is fun!",
                    userId: 1
                })
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(HTTP error! Status: ${response.status});
                }
                return response.json();
            })
            .then(data => {
                output.innerHTML = `
                    <strong style="color: green;">New Post Created!</strong><br><br>
                    <strong>Post ID:</strong> ${data.id}<br>
                    <strong>Title:</strong> ${data.title}<br>
                    <strong>Body:</strong> ${data.body}
                `;
            })
            .catch(error => {
                output.innerHTML = <span style="color:red;">Error: ${error.message}</span>;
            });
        });
    </script>
</body>
</html>
